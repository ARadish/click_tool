name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify toolchain
        shell: pwsh
        run: |
          go version
          gcc --version
      - name: Test
        shell: pwsh
        run: go test -tags win ./...
      - name: Vet
        shell: pwsh
        run: go vet -tags win ./...
      - name: Package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MouseKeeper-windows-amd64
          path: dist/MouseKeeper.exe
          if-no-files-found: error

